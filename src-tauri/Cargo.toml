[package]
name = "chatclaw"
version = "0.1.0"
description = "ChatClaw - Desktop App"
authors = ["HawkSept"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "image-ico", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
